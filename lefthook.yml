# lefthook.yml
pre-commit:
  commands:
    tests:
      run: pytest tests/ --tb=short -q
    lint:
      run: ruff check src/ tests/ --fix

commit-msg:
  commands:
    validate:
      run: |
        MSG=$(cat {1})
        if ! echo "$MSG" | grep -qE "^(feat|fix|chore|docs|refactor|test|style)\("; then
          echo "❌ Conventional Commits obrigatório: feat(escopo): descrição"
          exit 1
        fi